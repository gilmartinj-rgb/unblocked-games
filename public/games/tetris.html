<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Tetro Stack</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #090d16;
      color: #f1f5f9;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      user-select: none;
    }
    .wrapper {
      display: flex;
      gap: 16px;
      align-items: flex-start;
      max-width: 95vw;
    }
    #tetrisCanvas {
      background: #060913;
      border: 2px solid #1e293b;
      border-radius: 8px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.6);
      width: 240px;
      height: 480px;
      max-height: 80vh;
    }
    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 120px;
    }
    .card {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 6px;
      padding: 8px 12px;
      text-align: center;
    }
    .card-title { font-size: 11px; color: #64748b; font-weight: 700; margin-bottom: 2px; }
    .card-val { font-size: 16px; font-weight: 800; font-family: monospace; color: #38bdf8; }
    #nextCanvas {
      background: #060913;
      border: 1px solid #1e293b;
      border-radius: 4px;
      margin-top: 4px;
    }
    .overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(9, 13, 22, 0.9);
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      border-radius: 8px;
      z-index: 10;
    }
    .overlay.hidden { display: none; }
    .btn {
      padding: 8px 18px;
      background: #0284c7;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
    }
    .btn:hover { background: #0ea5e9; }
    .controls-hint {
      color: #64748b;
      font-size: 11px;
      margin-top: 10px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div style="display: flex; flex-direction: column; align-items: center;">
    <div class="wrapper">
      <div style="position: relative;">
        <canvas id="tetrisCanvas" width="240" height="480"></canvas>
        <div id="overlay" class="overlay">
          <h2 id="ovTitle" style="color:#38bdf8; font-size: 24px;">TETRO STACK</h2>
          <button id="startBtn" class="btn">START (SPACE)</button>
        </div>
      </div>
      <div class="sidebar">
        <div class="card">
          <div class="card-title">SCORE</div>
          <div id="score" class="card-val">0</div>
        </div>
        <div class="card">
          <div class="card-title">LINES</div>
          <div id="lines" class="card-val" style="color:#10b981;">0</div>
        </div>
        <div class="card">
          <div class="card-title">LEVEL</div>
          <div id="level" class="card-val" style="color:#f59e0b;">1</div>
        </div>
        <div class="card">
          <div class="card-title">NEXT</div>
          <canvas id="nextCanvas" width="80" height="80"></canvas>
        </div>
      </div>
    </div>
    <div class="controls-hint">← / → to Move · ↑ to Rotate · ↓ Soft Drop · Space Hard Drop</div>
  </div>

  <script>
    const canvas = document.getElementById('tetrisCanvas');
    const ctx = canvas.getContext('2d');
    const nextCanvas = document.getElementById('nextCanvas');
    const nextCtx = nextCanvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const linesEl = document.getElementById('lines');
    const levelEl = document.getElementById('level');
    const overlay = document.getElementById('overlay');
    const ovTitle = document.getElementById('ovTitle');
    const startBtn = document.getElementById('startBtn');

    const COLS = 10, ROWS = 20, BLOCK = 24;

    const PIECES = [
      { shape: [[1,1,1,1]], color: '#06b6d4' }, // I
      { shape: [[1,1],[1,1]], color: '#eab308' }, // O
      { shape: [[0,1,0],[1,1,1]], color: '#a855f7' }, // T
      { shape: [[1,0,0],[1,1,1]], color: '#3b82f6' }, // J
      { shape: [[0,0,1],[1,1,1]], color: '#f97316' }, // L
      { shape: [[0,1,1],[1,1,0]], color: '#22c55e' }, // S
      { shape: [[1,1,0],[0,1,1]], color: '#ef4444' }  // Z
    ];

    let grid = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
    let currentPiece = null;
    let nextPiece = null;
    let curX = 3, curY = 0;
    let score = 0, lines = 0, level = 1;
    let dropCounter = 0, dropInterval = 800;
    let lastTime = 0;
    let isPlaying = false;

    function randomPiece() {
      const p = PIECES[Math.floor(Math.random() * PIECES.length)];
      return { shape: p.shape, color: p.color };
    }

    function initGame() {
      grid = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
      score = 0; lines = 0; level = 1;
      dropInterval = 800;
      scoreEl.textContent = 0;
      linesEl.textContent = 0;
      levelEl.textContent = 1;
      nextPiece = randomPiece();
      spawnPiece();
      isPlaying = true;
      overlay.classList.add('hidden');
    }

    function spawnPiece() {
      currentPiece = nextPiece || randomPiece();
      nextPiece = randomPiece();
      curX = Math.floor((COLS - currentPiece.shape[0].length) / 2);
      curY = 0;
      drawNext();

      if (collides(curX, curY, currentPiece.shape)) {
        // Game Over
        isPlaying = false;
        ovTitle.textContent = 'GAME OVER';
        ovTitle.style.color = '#ef4444';
        startBtn.textContent = 'RETRY';
        overlay.classList.remove('hidden');
      }
    }

    function collides(x, y, shape) {
      for (let r = 0; r < shape.length; r++) {
        for (let c = 0; c < shape[r].length; c++) {
          if (shape[r][c]) {
            const nx = x + c;
            const ny = y + r;
            if (nx < 0 || nx >= COLS || ny >= ROWS) return true;
            if (ny >= 0 && grid[ny][nx]) return true;
          }
        }
      }
      return false;
    }

    function merge() {
      currentPiece.shape.forEach((row, r) => {
        row.forEach((val, c) => {
          if (val) {
            grid[curY + r][curX + c] = currentPiece.color;
          }
        });
      });

      // Clear full lines
      let cleared = 0;
      for (let r = ROWS - 1; r >= 0; r--) {
        if (grid[r].every(c => c !== 0)) {
          grid.splice(r, 1);
          grid.unshift(Array(COLS).fill(0));
          cleared++;
          r++;
        }
      }

      if (cleared > 0) {
        lines += cleared;
        score += [0, 100, 300, 500, 800][cleared] * level;
        level = Math.floor(lines / 10) + 1;
        dropInterval = Math.max(150, 800 - (level - 1) * 60);

        scoreEl.textContent = score;
        linesEl.textContent = lines;
        levelEl.textContent = level;
      }

      spawnPiece();
    }

    function rotate(shape) {
      const rows = shape.length, cols = shape[0].length;
      const res = Array.from({ length: cols }, () => Array(rows).fill(0));
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          res[c][rows - 1 - r] = shape[r][c];
        }
      }
      return res;
    }

    function drop() {
      if (!collides(curX, curY + 1, currentPiece.shape)) {
        curY++;
      } else {
        merge();
      }
      dropCounter = 0;
    }

    function hardDrop() {
      while (!collides(curX, curY + 1, currentPiece.shape)) {
        curY++;
        score += 2;
      }
      scoreEl.textContent = score;
      merge();
    }

    function update(time = 0) {
      const deltaTime = time - lastTime;
      lastTime = time;

      if (isPlaying) {
        dropCounter += deltaTime;
        if (dropCounter > dropInterval) drop();
      }

      render();
      requestAnimationFrame(update);
    }

    function render() {
      ctx.fillStyle = '#060913';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Grid
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          if (grid[r][c]) {
            ctx.fillStyle = grid[r][c];
            ctx.fillRect(c * BLOCK + 1, r * BLOCK + 1, BLOCK - 2, BLOCK - 2);
          }
        }
      }

      // Current falling piece
      if (currentPiece && isPlaying) {
        ctx.fillStyle = currentPiece.color;
        currentPiece.shape.forEach((row, r) => {
          row.forEach((val, c) => {
            if (val) {
              ctx.fillRect((curX + c) * BLOCK + 1, (curY + r) * BLOCK + 1, BLOCK - 2, BLOCK - 2);
            }
          });
        });
      }
    }

    function drawNext() {
      nextCtx.fillStyle = '#060913';
      nextCtx.fillRect(0, 0, nextCanvas.width, nextCanvas.height);
      if (!nextPiece) return;

      const size = 16;
      const offX = (nextCanvas.width - nextPiece.shape[0].length * size) / 2;
      const offY = (nextCanvas.height - nextPiece.shape.length * size) / 2;

      nextCtx.fillStyle = nextPiece.color;
      nextPiece.shape.forEach((row, r) => {
        row.forEach((val, c) => {
          if (val) {
            nextCtx.fillRect(offX + c * size + 1, offY + r * size + 1, size - 2, size - 2);
          }
        });
      });
    }

    window.addEventListener('keydown', e => {
      if (!isPlaying) {
        if (e.key === ' ') initGame();
        return;
      }

      switch (e.key) {
        case 'ArrowLeft':
        case 'a':
          if (!collides(curX - 1, curY, currentPiece.shape)) curX--;
          e.preventDefault();
          break;
        case 'ArrowRight':
        case 'd':
          if (!collides(curX + 1, curY, currentPiece.shape)) curX++;
          e.preventDefault();
          break;
        case 'ArrowDown':
        case 's':
          drop();
          e.preventDefault();
          break;
        case 'ArrowUp':
        case 'w':
          const rot = rotate(currentPiece.shape);
          if (!collides(curX, curY, rot)) currentPiece.shape = rot;
          e.preventDefault();
          break;
        case ' ':
          hardDrop();
          e.preventDefault();
          break;
      }
    });

    startBtn.addEventListener('click', initGame);
    update();
  </script>
</body>
</html>
