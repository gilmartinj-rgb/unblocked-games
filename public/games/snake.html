<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Neon Serpent</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #090d16;
      color: #f1f5f9;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      user-select: none;
    }
    .game-container {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      max-width: 100%;
      padding: 10px;
    }
    .hud {
      display: flex;
      justify-content: space-between;
      width: 480px;
      max-width: 95vw;
      padding: 8px 16px;
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
    }
    .score-item { display: flex; gap: 8px; align-items: center; }
    .score-val { color: #10b981; font-family: monospace; font-size: 16px; }
    .high-val { color: #f59e0b; font-family: monospace; font-size: 16px; }
    canvas {
      background: #0d121f;
      border: 2px solid #1e293b;
      border-radius: 8px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      max-width: 95vw;
      max-height: 68vh;
      aspect-ratio: 1 / 1;
    }
    .controls-hint {
      color: #64748b;
      font-size: 12px;
      text-align: center;
    }
    .overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(9, 13, 22, 0.88);
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      border-radius: 8px;
      z-index: 10;
    }
    .overlay.hidden { display: none; }
    .overlay h2 { font-size: 28px; color: #10b981; }
    .btn {
      padding: 10px 24px;
      background: #10b981;
      color: #090d16;
      border: none;
      border-radius: 6px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .btn:hover { background: #34d399; transform: translateY(-1px); }
    .touch-controls {
      display: none;
      grid-template-columns: repeat(3, 48px);
      gap: 6px;
      margin-top: 4px;
    }
    @media (max-width: 600px) {
      .touch-controls { display: grid; }
    }
    .t-btn {
      background: #1e293b;
      color: #f1f5f9;
      border: 1px solid #334155;
      border-radius: 6px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="game-container">
    <div class="hud">
      <div class="score-item">SCORE <span id="score" class="score-val">0</span></div>
      <div class="score-item">SPEED <span id="speed" class="score-val">1x</span></div>
      <div class="score-item">BEST <span id="best" class="high-val">0</span></div>
    </div>
    <div style="position: relative;">
      <canvas id="gameCanvas" width="480" height="480"></canvas>
      <div id="overlay" class="overlay">
        <h2 id="overlayTitle">NEON SERPENT</h2>
        <p id="overlaySub" style="color:#94a3b8; font-size:14px;">Eat glowing energy cells & grow.</p>
        <button id="startBtn" class="btn">PLAY (SPACE)</button>
      </div>
    </div>
    <div class="controls-hint">Use Arrow Keys or W-A-S-D to steer · Space to pause</div>
    <div class="touch-controls">
      <div></div>
      <button class="t-btn" onclick="setDir(0, -1)">▲</button>
      <div></div>
      <button class="t-btn" onclick="setDir(-1, 0)">◀</button>
      <button class="t-btn" onclick="setDir(0, 1)">▼</button>
      <button class="t-btn" onclick="setDir(1, 0)">▶</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    const speedEl = document.getElementById('speed');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlayTitle');
    const overlaySub = document.getElementById('overlaySub');
    const startBtn = document.getElementById('startBtn');

    const GRID_SIZE = 20;
    const CELL_SIZE = canvas.width / GRID_SIZE;

    let snake = [];
    let food = { x: 5, y: 5, type: 'normal' };
    let dx = 1, dy = 0;
    let nextDx = 1, nextDy = 0;
    let score = 0;
    let best = localStorage.getItem('snake_high_score') || 0;
    bestEl.textContent = best;
    let isRunning = false;
    let isPaused = false;
    let gameLoop = null;
    let speed = 110;

    // Web Audio Synthesizer
    let audioCtx = null;
    function playBeep(freq, type='square', duration=0.08) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch(e) {}
    }

    function initGame() {
      snake = [
        { x: 10, y: 10 },
        { x: 9, y: 10 },
        { x: 8, y: 10 }
      ];
      dx = 1; dy = 0;
      nextDx = 1; nextDy = 0;
      score = 0;
      speed = 110;
      scoreEl.textContent = score;
      speedEl.textContent = '1x';
      spawnFood();
      isRunning = true;
      isPaused = false;
      overlay.classList.add('hidden');
      if (gameLoop) clearInterval(gameLoop);
      gameLoop = setInterval(step, speed);
      draw();
    }

    function spawnFood() {
      let valid = false;
      while (!valid) {
        food.x = Math.floor(Math.random() * GRID_SIZE);
        food.y = Math.floor(Math.random() * GRID_SIZE);
        valid = !snake.some(segment => segment.x === food.x && segment.y === food.y);
      }
      food.type = Math.random() < 0.2 ? 'bonus' : 'normal';
    }

    function step() {
      if (!isRunning || isPaused) return;

      dx = nextDx;
      dy = nextDy;

      const head = { x: snake[0].x + dx, y: snake[0].y + dy };

      // Wall collision
      if (head.x < 0 || head.x >= GRID_SIZE || head.y < 0 || head.y >= GRID_SIZE) {
        gameOver();
        return;
      }

      // Self collision
      if (snake.some(segment => segment.x === head.x && segment.y === head.y)) {
        gameOver();
        return;
      }

      snake.unshift(head);

      // Check food eat
      if (head.x === food.x && head.y === food.y) {
        const pts = food.type === 'bonus' ? 25 : 10;
        score += pts;
        scoreEl.textContent = score;
        if (score > best) {
          best = score;
          bestEl.textContent = best;
          localStorage.setItem('snake_high_score', best);
        }
        playBeep(food.type === 'bonus' ? 660 : 440, 'triangle', 0.1);
        spawnFood();

        // Speed scaling
        if (score % 50 === 0 && speed > 60) {
          speed -= 5;
          speedEl.textContent = ((110 - speed) / 10 + 1).toFixed(1) + 'x';
          clearInterval(gameLoop);
          gameLoop = setInterval(step, speed);
        }
      } else {
        snake.pop();
      }

      draw();
    }

    function gameOver() {
      isRunning = false;
      clearInterval(gameLoop);
      playBeep(180, 'sawtooth', 0.3);
      overlayTitle.textContent = 'GAME OVER';
      overlayTitle.style.color = '#ef4444';
      overlaySub.textContent = `Final Score: ${score}`;
      startBtn.textContent = 'RETRY (SPACE)';
      overlay.classList.remove('hidden');
    }

    function draw() {
      ctx.fillStyle = '#0a0f1d';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Grid lines
      ctx.strokeStyle = '#131b2e';
      ctx.lineWidth = 1;
      for (let i = 0; i <= GRID_SIZE; i++) {
        ctx.beginPath();
        ctx.moveTo(i * CELL_SIZE, 0);
        ctx.lineTo(i * CELL_SIZE, canvas.height);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, i * CELL_SIZE);
        ctx.lineTo(canvas.width, i * CELL_SIZE);
        ctx.stroke();
      }

      // Food
      if (food.type === 'bonus') {
        ctx.fillStyle = '#f59e0b';
        ctx.shadowColor = '#f59e0b';
      } else {
        ctx.fillStyle = '#ef4444';
        ctx.shadowColor = '#ef4444';
      }
      ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.arc(food.x * CELL_SIZE + CELL_SIZE/2, food.y * CELL_SIZE + CELL_SIZE/2, CELL_SIZE/2 - 3, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;

      // Snake
      snake.forEach((segment, idx) => {
        if (idx === 0) {
          ctx.fillStyle = '#10b981';
          ctx.shadowColor = '#10b981';
          ctx.shadowBlur = 8;
        } else {
          ctx.fillStyle = '#059669';
          ctx.shadowBlur = 0;
        }
        ctx.fillRect(
          segment.x * CELL_SIZE + 1.5,
          segment.y * CELL_SIZE + 1.5,
          CELL_SIZE - 3,
          CELL_SIZE - 3
        );
      });
      ctx.shadowBlur = 0;
    }

    function setDir(x, y) {
      if (!isRunning) return;
      if (x !== 0 && dx === 0) { nextDx = x; nextDy = 0; }
      if (y !== 0 && dy === 0) { nextDx = 0; nextDy = y; }
    }

    window.addEventListener('keydown', (e) => {
      switch(e.key) {
        case 'ArrowUp':
        case 'w':
        case 'W':
          if (dy === 0) { nextDx = 0; nextDy = -1; }
          e.preventDefault();
          break;
        case 'ArrowDown':
        case 's':
        case 'S':
          if (dy === 0) { nextDx = 0; nextDy = 1; }
          e.preventDefault();
          break;
        case 'ArrowLeft':
        case 'a':
        case 'A':
          if (dx === 0) { nextDx = -1; nextDy = 0; }
          e.preventDefault();
          break;
        case 'ArrowRight':
        case 'd':
        case 'D':
          if (dx === 0) { nextDx = 1; nextDy = 0; }
          e.preventDefault();
          break;
        case ' ':
          if (!isRunning) {
            initGame();
          } else {
            isPaused = !isPaused;
            if (isPaused) {
              overlayTitle.textContent = 'PAUSED';
              overlayTitle.style.color = '#38bdf8';
              overlaySub.textContent = 'Press Space to resume';
              startBtn.textContent = 'RESUME';
              overlay.classList.remove('hidden');
            } else {
              overlay.classList.add('hidden');
            }
          }
          e.preventDefault();
          break;
      }
    });

    startBtn.addEventListener('click', () => {
      if (!isRunning || isPaused) {
        if (isPaused) {
          isPaused = false;
          overlay.classList.add('hidden');
        } else {
          initGame();
        }
      }
    });

    draw();
  </script>
</body>
</html>
