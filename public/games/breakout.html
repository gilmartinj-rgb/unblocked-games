<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Neon Breakout</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #090d16;
      color: #f1f5f9;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      user-select: none;
    }
    .hud {
      display: flex;
      justify-content: space-between;
      width: 480px;
      max-width: 95vw;
      padding: 8px 16px;
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 8px 8px 0 0;
      font-size: 13px;
      font-weight: 600;
    }
    #canvas {
      background: #060913;
      border: 1px solid #1e293b;
      border-top: none;
      border-radius: 0 0 8px 8px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      max-width: 95vw;
      max-height: 70vh;
      aspect-ratio: 480 / 480;
    }
    .overlay {
      position: absolute;
      width: 480px;
      max-width: 95vw;
      height: 480px;
      background: rgba(9, 13, 22, 0.9);
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      z-index: 10;
      border-radius: 8px;
    }
    .overlay.hidden { display: none; }
    .btn {
      padding: 10px 24px;
      background: #8b5cf6;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
    }
    .btn:hover { background: #a78bfa; }
    .hint { color: #64748b; font-size: 12px; margin-top: 8px; }
  </style>
</head>
<body>
  <div style="position: relative; display: flex; flex-direction: column; align-items: center;">
    <div class="hud">
      <div>SCORE <span id="score" style="color:#a78bfa; font-family:monospace;">0</span></div>
      <div>BRICKS <span id="remaining" style="color:#38bdf8; font-family:monospace;">0</span></div>
      <div>LIVES <span id="lives" style="color:#f43f5e; font-family:monospace;">♥♥♥</span></div>
    </div>
    <canvas id="canvas" width="480" height="480"></canvas>
    <div id="overlay" class="overlay">
      <h2 id="ovTitle" style="color:#a78bfa; font-size: 26px;">NEON BREAKOUT</h2>
      <p id="ovSub" style="color:#94a3b8; font-size:14px;">Clear all prism bricks with your laser orb.</p>
      <button id="startBtn" class="btn">LAUNCH BALL</button>
    </div>
    <div class="hint">Mouse / Touch / Left-Right Arrows to steer paddle · Space to launch</div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const remEl = document.getElementById('remaining');
    const livesEl = document.getElementById('lives');
    const overlay = document.getElementById('overlay');
    const ovTitle = document.getElementById('ovTitle');
    const ovSub = document.getElementById('ovSub');
    const startBtn = document.getElementById('startBtn');

    let paddle = { x: 200, y: 440, w: 80, h: 10, speed: 7 };
    let ball = { x: 240, y: 420, r: 6, vx: 4, vy: -4, attached: true };
    let bricks = [];
    let score = 0;
    let lives = 3;
    let isPlaying = false;
    let keys = {};

    let audioCtx = null;
    function beep(f, d=0.05) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.frequency.setValueAtTime(f, audioCtx.currentTime);
        g.gain.setValueAtTime(0.06, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + d);
        o.connect(g);
        g.connect(audioCtx.destination);
        o.start();
        o.stop(audioCtx.currentTime + d);
      } catch(e) {}
    }

    const COLORS = ['#ef4444', '#f59e0b', '#10b981', '#38bdf8', '#8b5cf6'];

    function createBricks() {
      bricks = [];
      const rows = 5;
      const cols = 8;
      const bW = 50;
      const bH = 18;
      const pad = 6;
      const offX = 20;
      const offY = 40;

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          bricks.push({
            x: offX + c * (bW + pad),
            y: offY + r * (bH + pad),
            w: bW,
            h: bH,
            color: COLORS[r],
            alive: true,
            pts: (5 - r) * 10
          });
        }
      }
      remEl.textContent = bricks.length;
    }

    function initGame() {
      score = 0;
      lives = 3;
      scoreEl.textContent = score;
      livesEl.textContent = '♥♥♥';
      createBricks();
      resetBall();
      isPlaying = true;
      overlay.classList.add('hidden');
    }

    function resetBall() {
      ball.attached = true;
      ball.x = paddle.x + paddle.w / 2;
      ball.y = paddle.y - ball.r - 2;
      ball.vx = 4 * (Math.random() > 0.5 ? 1 : -1);
      ball.vy = -4;
    }

    function launchBall() {
      if (ball.attached) {
        ball.attached = false;
        beep(440);
      }
    }

    function update() {
      if (!isPlaying) return;

      // Move paddle with keys
      if (keys['ArrowLeft'] || keys['a'] || keys['A']) paddle.x -= paddle.speed;
      if (keys['ArrowRight'] || keys['d'] || keys['D']) paddle.x += paddle.speed;
      paddle.x = Math.max(0, Math.min(canvas.width - paddle.w, paddle.x));

      if (ball.attached) {
        ball.x = paddle.x + paddle.w / 2;
        ball.y = paddle.y - ball.r - 2;
        if (keys[' ']) launchBall();
        return;
      }

      // Ball movement
      ball.x += ball.vx;
      ball.y += ball.vy;

      // Wall bounce
      if (ball.x - ball.r <= 0) { ball.x = ball.r; ball.vx *= -1; beep(300); }
      if (ball.x + ball.r >= canvas.width) { ball.x = canvas.width - ball.r; ball.vx *= -1; beep(300); }
      if (ball.y - ball.r <= 0) { ball.y = ball.r; ball.vy *= -1; beep(300); }

      // Bottom death
      if (ball.y > canvas.height + 20) {
        lives--;
        livesEl.textContent = '♥'.repeat(Math.max(0, lives));
        beep(180, 0.2);
        if (lives <= 0) {
          gameOver(false);
          return;
        } else {
          resetBall();
        }
      }

      // Paddle bounce
      if (ball.y + ball.r >= paddle.y &&
          ball.y - ball.r <= paddle.y + paddle.h &&
          ball.x >= paddle.x &&
          ball.x <= paddle.x + paddle.w &&
          ball.vy > 0) {
        const hitOffset = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2);
        ball.vx = hitOffset * 6;
        ball.vy = -Math.abs(ball.vy);
        beep(520);
      }

      // Brick hit
      let activeCount = 0;
      bricks.forEach(b => {
        if (!b.alive) return;
        activeCount++;

        if (ball.x + ball.r > b.x &&
            ball.x - ball.r < b.x + b.w &&
            ball.y + ball.r > b.y &&
            ball.y - ball.r < b.y + b.h) {
          b.alive = false;
          ball.vy *= -1;
          score += b.pts;
          scoreEl.textContent = score;
          beep(680);
        }
      });
      remEl.textContent = activeCount;

      if (activeCount === 0) {
        gameOver(true);
      }
    }

    function gameOver(win) {
      isPlaying = false;
      ovTitle.textContent = win ? 'VICTORY!' : 'ORB LOST';
      ovTitle.style.color = win ? '#10b981' : '#f43f5e';
      ovSub.textContent = `Score: ${score}`;
      startBtn.textContent = 'PLAY AGAIN';
      overlay.classList.remove('hidden');
    }

    function render() {
      ctx.fillStyle = '#060913';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Bricks
      bricks.forEach(b => {
        if (!b.alive) return;
        ctx.fillStyle = b.color;
        ctx.fillRect(b.x, b.y, b.w, b.h);
      });

      // Paddle
      ctx.fillStyle = '#8b5cf6';
      ctx.shadowColor = '#8b5cf6';
      ctx.shadowBlur = 8;
      ctx.fillRect(paddle.x, paddle.y, paddle.w, paddle.h);

      // Ball
      ctx.fillStyle = '#f8fafc';
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    function loop() {
      update();
      render();
      requestAnimationFrame(loop);
    }

    window.addEventListener('keydown', e => {
      keys[e.key] = true;
      if (e.key === ' ' && ball.attached) launchBall();
    });
    window.addEventListener('keyup', e => { keys[e.key] = false; });

    canvas.addEventListener('mousemove', e => {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      paddle.x = Math.max(0, Math.min(canvas.width - paddle.w, (e.clientX - rect.left) * scaleX - paddle.w / 2));
    });
    canvas.addEventListener('mousedown', launchBall);
    canvas.addEventListener('touchmove', e => {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      paddle.x = Math.max(0, Math.min(canvas.width - paddle.w, (e.touches[0].clientX - rect.left) * scaleX - paddle.w / 2));
      launchBall();
      e.preventDefault();
    });

    startBtn.addEventListener('click', initGame);
    loop();
  </script>
</body>
</html>
