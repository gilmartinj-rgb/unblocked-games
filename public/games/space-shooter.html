<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Galactic Defender</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #060913;
      color: #f1f5f9;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      user-select: none;
    }
    .hud {
      display: flex;
      justify-content: space-between;
      width: 440px;
      max-width: 95vw;
      padding: 8px 16px;
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 8px 8px 0 0;
      font-size: 13px;
      font-weight: 600;
    }
    .hud span { font-family: monospace; font-size: 15px; }
    .score-c { color: #38bdf8; }
    .lives-c { color: #f43f5e; }
    .wave-c { color: #fbbf24; }
    #canvas {
      background: #050814;
      border: 1px solid #1e293b;
      border-top: none;
      border-radius: 0 0 8px 8px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      max-width: 95vw;
      max-height: 75vh;
      aspect-ratio: 440 / 600;
    }
    .overlay {
      position: absolute;
      width: 440px;
      max-width: 95vw;
      height: 600px;
      max-height: 75vh;
      background: rgba(6, 9, 19, 0.9);
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 10;
      border-radius: 8px;
    }
    .overlay.hidden { display: none; }
    .btn {
      padding: 10px 28px;
      background: #0284c7;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn:hover { background: #0ea5e9; }
    .hint { color: #64748b; font-size: 12px; margin-top: 8px; }
  </style>
</head>
<body>
  <div style="position: relative; display: flex; flex-direction: column; align-items: center;">
    <div class="hud">
      <div>SCORE <span id="score" class="score-c">0</span></div>
      <div>WAVE <span id="wave" class="wave-c">1</span></div>
      <div>SHIPS <span id="lives" class="lives-c">♥♥♥</span></div>
    </div>
    <canvas id="canvas" width="440" height="600"></canvas>
    <div id="overlay" class="overlay">
      <h2 id="ovTitle" style="color:#38bdf8; font-size: 26px;">GALACTIC DEFENDER</h2>
      <p id="ovSub" style="color: #94a3b8; font-size: 14px;">Repel the alien armada.</p>
      <button id="startBtn" class="btn">LAUNCH MISSION</button>
    </div>
    <div class="hint">A/D or Left/Right or Mouse/Touch to move · Space or Click to Fire</div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const waveEl = document.getElementById('wave');
    const livesEl = document.getElementById('lives');
    const overlay = document.getElementById('overlay');
    const ovTitle = document.getElementById('ovTitle');
    const ovSub = document.getElementById('ovSub');
    const startBtn = document.getElementById('startBtn');

    let audioCtx = null;
    function sound(freq, duration=0.08, type='square') {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        g.gain.setValueAtTime(0.06, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(g);
        g.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch(e) {}
    }

    let player = { x: 220, y: 540, w: 28, h: 28, speed: 6, vx: 0 };
    let bullets = [];
    let enemies = [];
    let stars = [];
    let particles = [];
    let score = 0;
    let wave = 1;
    let lives = 3;
    let isPlaying = false;
    let keys = {};
    let lastShot = 0;

    // Generate stars
    for (let i = 0; i < 60; i++) {
      stars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        size: Math.random() * 2 + 0.5,
        speed: Math.random() * 1.5 + 0.5
      });
    }

    function spawnWave() {
      enemies = [];
      const rows = Math.min(3 + Math.floor(wave / 2), 6);
      const cols = 7;
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          enemies.push({
            x: 50 + c * 50,
            y: 40 + r * 42,
            w: 24,
            h: 20,
            hp: r === 0 ? 2 : 1,
            maxHp: r === 0 ? 2 : 1,
            color: r === 0 ? '#ec4899' : (r % 2 === 0 ? '#a855f7' : '#38bdf8'),
            vx: 1 + wave * 0.2
          });
        }
      }
    }

    function initGame() {
      score = 0;
      wave = 1;
      lives = 3;
      scoreEl.textContent = score;
      waveEl.textContent = wave;
      updateLives();
      player.x = canvas.width / 2;
      bullets = [];
      particles = [];
      spawnWave();
      isPlaying = true;
      overlay.classList.add('hidden');
    }

    function updateLives() {
      livesEl.textContent = '♥'.repeat(Math.max(0, lives));
    }

    function addExplosion(x, y, color) {
      for (let i = 0; i < 14; i++) {
        const angle = Math.random() * Math.PI * 2;
        const spd = Math.random() * 3 + 1;
        particles.push({
          x, y,
          vx: Math.cos(angle) * spd,
          vy: Math.sin(angle) * spd,
          life: 1,
          decay: Math.random() * 0.04 + 0.02,
          color
        });
      }
    }

    function shoot() {
      const now = Date.now();
      if (now - lastShot < 180) return;
      lastShot = now;
      bullets.push({ x: player.x, y: player.y - 14, speed: 9 });
      sound(720, 0.05, 'triangle');
    }

    function update() {
      // Stars background
      stars.forEach(s => {
        s.y += s.speed;
        if (s.y > canvas.height) s.y = 0;
      });

      if (!isPlaying) return;

      // Controls
      if (keys['ArrowLeft'] || keys['a'] || keys['A']) player.x -= player.speed;
      if (keys['ArrowRight'] || keys['d'] || keys['D']) player.x += player.speed;
      if (keys[' ']) shoot();

      player.x = Math.max(player.w / 2, Math.min(canvas.width - player.w / 2, player.x));

      // Bullets
      for (let i = bullets.length - 1; i >= 0; i--) {
        bullets[i].y -= bullets[i].speed;
        if (bullets[i].y < -10) bullets.splice(i, 1);
      }

      // Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= p.decay;
        if (p.life <= 0) particles.splice(i, 1);
      }

      // Enemy swarm movement
      let reverse = false;
      enemies.forEach(e => {
        e.x += e.vx;
        if (e.x + e.w > canvas.width - 20 || e.x < 20) reverse = true;
      });
      if (reverse) {
        enemies.forEach(e => {
          e.vx *= -1;
          e.y += 12;
          if (e.y > player.y - 20) {
            // Reached player base
            lives = 0;
            updateLives();
            gameOver();
          }
        });
      }

      // Bullet hit enemy
      for (let b = bullets.length - 1; b >= 0; b--) {
        for (let e = enemies.length - 1; e >= 0; e--) {
          const bul = bullets[b];
          const en = enemies[e];
          if (bul && en &&
              bul.x > en.x && bul.x < en.x + en.w &&
              bul.y > en.y && bul.y < en.y + en.h) {
            bullets.splice(b, 1);
            en.hp--;
            if (en.hp <= 0) {
              addExplosion(en.x + en.w/2, en.y + en.h/2, en.color);
              score += en.maxHp * 50;
              scoreEl.textContent = score;
              enemies.splice(e, 1);
              sound(300, 0.1, 'sawtooth');
            } else {
              sound(450, 0.05, 'square');
            }
            break;
          }
        }
      }

      // Wave clear
      if (enemies.length === 0) {
        wave++;
        waveEl.textContent = wave;
        sound(880, 0.25, 'triangle');
        spawnWave();
      }
    }

    function gameOver() {
      isPlaying = false;
      sound(150, 0.4, 'sawtooth');
      ovTitle.textContent = 'FLEET COMPROMISED';
      ovTitle.style.color = '#f43f5e';
      ovSub.textContent = `Score: ${score} · Wave: ${wave}`;
      startBtn.textContent = 'RETRY MISSION';
      overlay.classList.remove('hidden');
    }

    function render() {
      ctx.fillStyle = '#050814';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Stars
      ctx.fillStyle = '#94a3b8';
      stars.forEach(s => {
        ctx.fillRect(s.x, s.y, s.size, s.size);
      });

      // Bullets
      ctx.fillStyle = '#38bdf8';
      bullets.forEach(b => {
        ctx.fillRect(b.x - 2, b.y, 4, 12);
      });

      // Enemies
      enemies.forEach(e => {
        ctx.fillStyle = e.color;
        ctx.fillRect(e.x, e.y, e.w, e.h);
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(e.x + 4, e.y + 4, 4, 4);
        ctx.fillRect(e.x + e.w - 8, e.y + 4, 4, 4);
      });

      // Particles
      particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life;
        ctx.fillRect(p.x, p.y, 3, 3);
      });
      ctx.globalAlpha = 1;

      // Player Ship
      if (isPlaying) {
        ctx.fillStyle = '#38bdf8';
        ctx.beginPath();
        ctx.moveTo(player.x, player.y - player.h / 2);
        ctx.lineTo(player.x - player.w / 2, player.y + player.h / 2);
        ctx.lineTo(player.x, player.y + player.h / 4);
        ctx.lineTo(player.x + player.w / 2, player.y + player.h / 2);
        ctx.closePath();
        ctx.fill();

        // Thruster flame
        ctx.fillStyle = '#f59e0b';
        ctx.fillRect(player.x - 3, player.y + player.h / 2, 6, Math.random() * 8 + 4);
      }
    }

    function loop() {
      update();
      render();
      requestAnimationFrame(loop);
    }

    window.addEventListener('keydown', e => {
      keys[e.key] = true;
      if (e.key === ' ' && isPlaying) e.preventDefault();
    });
    window.addEventListener('keyup', e => { keys[e.key] = false; });

    // Mouse / Touch control
    canvas.addEventListener('mousemove', e => {
      if (!isPlaying) return;
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      player.x = (e.clientX - rect.left) * scaleX;
    });
    canvas.addEventListener('mousedown', () => { if (isPlaying) shoot(); });
    canvas.addEventListener('touchmove', e => {
      if (!isPlaying) return;
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      player.x = (e.touches[0].clientX - rect.left) * scaleX;
      shoot();
      e.preventDefault();
    });

    startBtn.addEventListener('click', initGame);
    loop();
  </script>
</body>
</html>
