<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Cyber Pong</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #090d16;
      color: #f1f5f9;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      user-select: none;
    }
    .hud {
      display: flex;
      justify-content: space-around;
      width: 520px;
      max-width: 95vw;
      padding: 10px 16px;
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 8px 8px 0 0;
      font-size: 14px;
      font-weight: 700;
    }
    .score-txt { font-family: monospace; font-size: 24px; color: #38bdf8; }
    #canvas {
      background: #060913;
      border: 1px solid #1e293b;
      border-top: none;
      border-radius: 0 0 8px 8px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      max-width: 95vw;
      max-height: 70vh;
      aspect-ratio: 520 / 340;
    }
    .overlay {
      position: absolute;
      width: 520px;
      max-width: 95vw;
      height: 340px;
      background: rgba(9, 13, 22, 0.9);
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      z-index: 10;
      border-radius: 8px;
    }
    .overlay.hidden { display: none; }
    .btn {
      padding: 10px 24px;
      background: #0284c7;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
    }
    .btn:hover { background: #0ea5e9; }
    .hint { color: #64748b; font-size: 12px; margin-top: 8px; }
  </style>
</head>
<body>
  <div style="position: relative; display: flex; flex-direction: column; align-items: center;">
    <div class="hud">
      <div>PLAYER <span id="pScore" class="score-txt">0</span></div>
      <div style="color: #64748b; font-size:12px; align-self: center;">FIRST TO 7</div>
      <div>AI BOT <span id="aiScore" class="score-txt" style="color:#ef4444;">0</span></div>
    </div>
    <canvas id="canvas" width="520" height="340"></canvas>
    <div id="overlay" class="overlay">
      <h2 id="ovTitle" style="color:#38bdf8; font-size: 26px;">CYBER PONG</h2>
      <p id="ovSub" style="color:#94a3b8; font-size: 14px;">High-speed vector paddle duel against AI.</p>
      <button id="startBtn" class="btn">START MATCH (SPACE)</button>
    </div>
    <div class="hint">W / S or Up / Down or Mouse / Touch to move paddle</div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const pScoreEl = document.getElementById('pScore');
    const aiScoreEl = document.getElementById('aiScore');
    const overlay = document.getElementById('overlay');
    const ovTitle = document.getElementById('ovTitle');
    const ovSub = document.getElementById('ovSub');
    const startBtn = document.getElementById('startBtn');

    let audioCtx = null;
    function beep(f, d=0.05) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.frequency.setValueAtTime(f, audioCtx.currentTime);
        g.gain.setValueAtTime(0.06, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + d);
        o.connect(g);
        g.connect(audioCtx.destination);
        o.start();
        o.stop(audioCtx.currentTime + d);
      } catch(e) {}
    }

    const PADDLE_H = 64;
    const PADDLE_W = 10;
    let player = { x: 20, y: 138, vy: 0, speed: 6 };
    let ai = { x: canvas.width - 30, y: 138, speed: 4.2 };
    let ball = { x: 260, y: 170, r: 6, vx: 5, vy: 3 };
    let pScore = 0, aiScore = 0;
    let isPlaying = false;
    let keys = {};

    function initGame() {
      pScore = 0;
      aiScore = 0;
      pScoreEl.textContent = 0;
      aiScoreEl.textContent = 0;
      resetBall(1);
      isPlaying = true;
      overlay.classList.add('hidden');
    }

    function resetBall(dir) {
      ball.x = canvas.width / 2;
      ball.y = canvas.height / 2;
      ball.vx = 5 * dir;
      ball.vy = (Math.random() * 4 - 2);
    }

    function update() {
      if (!isPlaying) return;

      // Player move
      if (keys['ArrowUp'] || keys['w'] || keys['W']) player.y -= player.speed;
      if (keys['ArrowDown'] || keys['s'] || keys['S']) player.y += player.speed;
      player.y = Math.max(0, Math.min(canvas.height - PADDLE_H, player.y));

      // AI move (with reaction smoothing)
      const aiCenter = ai.y + PADDLE_H / 2;
      if (ball.vx > 0) {
        if (aiCenter < ball.y - 10) ai.y += ai.speed;
        else if (aiCenter > ball.y + 10) ai.y -= ai.speed;
      }
      ai.y = Math.max(0, Math.min(canvas.height - PADDLE_H, ai.y));

      // Ball move
      ball.x += ball.vx;
      ball.y += ball.vy;

      // Top / bottom bounce
      if (ball.y - ball.r <= 0 || ball.y + ball.r >= canvas.height) {
        ball.vy *= -1;
        beep(320);
      }

      // Player paddle hit
      if (ball.x - ball.r <= player.x + PADDLE_W &&
          ball.x + ball.r >= player.x &&
          ball.y >= player.y &&
          ball.y <= player.y + PADDLE_H &&
          ball.vx < 0) {
        ball.vx = Math.min(10, Math.abs(ball.vx) * 1.05);
        const offset = (ball.y - (player.y + PADDLE_H / 2)) / (PADDLE_H / 2);
        ball.vy = offset * 5;
        beep(540);
      }

      // AI paddle hit
      if (ball.x + ball.r >= ai.x &&
          ball.x - ball.r <= ai.x + PADDLE_W &&
          ball.y >= ai.y &&
          ball.y <= ai.y + PADDLE_H &&
          ball.vx > 0) {
        ball.vx = -Math.min(10, Math.abs(ball.vx) * 1.05);
        const offset = (ball.y - (ai.y + PADDLE_H / 2)) / (PADDLE_H / 2);
        ball.vy = offset * 5;
        beep(480);
      }

      // Scoring
      if (ball.x < 0) {
        aiScore++;
        aiScoreEl.textContent = aiScore;
        beep(220, 0.2);
        checkWinner(1);
      } else if (ball.x > canvas.width) {
        pScore++;
        pScoreEl.textContent = pScore;
        beep(660, 0.2);
        checkWinner(-1);
      }
    }

    function checkWinner(nextDir) {
      if (pScore >= 7 || aiScore >= 7) {
        isPlaying = false;
        const playerWon = pScore >= 7;
        ovTitle.textContent = playerWon ? 'YOU WIN!' : 'AI BOT WINS!';
        ovTitle.style.color = playerWon ? '#10b981' : '#ef4444';
        ovSub.textContent = `Final: ${pScore} - ${aiScore}`;
        startBtn.textContent = 'REMATCH';
        overlay.classList.remove('hidden');
      } else {
        resetBall(nextDir);
      }
    }

    function render() {
      ctx.fillStyle = '#060913';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Center dashed line
      ctx.strokeStyle = '#1e293b';
      ctx.setLineDash([6, 6]);
      ctx.beginPath();
      ctx.moveTo(canvas.width / 2, 0);
      ctx.lineTo(canvas.width / 2, canvas.height);
      ctx.stroke();
      ctx.setLineDash([]);

      // Paddles
      ctx.fillStyle = '#38bdf8';
      ctx.fillRect(player.x, player.y, PADDLE_W, PADDLE_H);

      ctx.fillStyle = '#ef4444';
      ctx.fillRect(ai.x, ai.y, PADDLE_W, PADDLE_H);

      // Ball
      ctx.fillStyle = '#f8fafc';
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
      ctx.fill();
    }

    function loop() {
      update();
      render();
      requestAnimationFrame(loop);
    }

    window.addEventListener('keydown', e => {
      keys[e.key] = true;
      if (['ArrowUp', 'ArrowDown', ' '].includes(e.key)) e.preventDefault();
      if (!isPlaying && e.key === ' ') initGame();
    });
    window.addEventListener('keyup', e => { keys[e.key] = false; });

    canvas.addEventListener('mousemove', e => {
      const rect = canvas.getBoundingClientRect();
      const scaleY = canvas.height / rect.height;
      player.y = Math.max(0, Math.min(canvas.height - PADDLE_H, (e.clientY - rect.top) * scaleY - PADDLE_H / 2));
    });
    canvas.addEventListener('touchmove', e => {
      const rect = canvas.getBoundingClientRect();
      const scaleY = canvas.height / rect.height;
      player.y = Math.max(0, Math.min(canvas.height - PADDLE_H, (e.touches[0].clientY - rect.top) * scaleY - PADDLE_H / 2));
      e.preventDefault();
    });

    startBtn.addEventListener('click', initGame);
    loop();
  </script>
</body>
</html>
